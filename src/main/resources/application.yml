spring:
  application:
    name: follow-through

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:followthrough}
    username: ${DB_USERNAME:followthrough}
    password: ${DB_PASSWORD:followthrough}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  metrics:
    tags:
      application: follow-through

resilience4j:
  circuitbreaker:
    instances:
      llm:
        failure-rate-threshold: 50
        minimum-number-of-calls: 3
        sliding-window-size: 5
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2

# --- LLM Provider Configuration ---
# Set llm.provider to "gemini" (default) or "claude"
llm:
  provider: ${LLM_PROVIDER:gemini}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: gemini-2.5-flash
  base-url: https://generativelanguage.googleapis.com/v1beta

claude:
  api-key: ${CLAUDE_API_KEY:}
  model: claude-sonnet-4-20250514
  base-url: https://api.anthropic.com/v1
  max-tokens: 4096
